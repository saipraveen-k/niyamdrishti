version: "3.9"

# Local development stack.
# Production uses Render (backend) + Vercel (frontend) + Supabase (DB + Auth + Storage).

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: niyamdrishti-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DEBUG=true
      - UVICORN_WORKERS=1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # live reload in dev
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: niyamdrishti-frontend
    working_dir: /app
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

  # ── PostgreSQL (local dev only — production uses Supabase) ───────────────────
  postgres:
    image: postgres:16-alpine
    container_name: niyamdrishti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: niyamdrishti
      POSTGRES_USER: niyamdrishti
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niyamdrishti"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (optional: session cache / rate limiting) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: niyamdrishti-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
